<div class="details-container" *ngIf="character; else noData">
  <mat-card>
    <img
      mat-card-image
      [src]="character.image || 'https://via.placeholder.com/300x350?text=No+Image'"
      [alt]="character.name"
    />

    <mat-card-content>
      <h2>{{ character.name }}</h2>
      <p><strong>Species:</strong> {{ character.species }}</p>
      <p><strong>House:</strong> {{ character.house }}</p>
      <p><strong>Wizard:</strong> {{ character.wizard }}</p>
      <p><strong>Ancestry:</strong> {{ character.ancestry }}</p>
      <p><strong>Actor:</strong> {{ character.actor }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" routerLink="/">Back</button>
    </mat-card-actions>
  </mat-card>
</div>

<ng-template #noData>
  <p style="text-align: center; margin-top: 30px;">No character data found.</p>
</ng-template>
